name: Daily Recipe Scrape

on:
  schedule:
    # Every day at 3:00 AM UTC
    - cron: "0 3 * * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci

      - name: Scrape new recipes
        run: npx tsx scripts/scrape-bulk.ts --limit 100

      - name: Fix categories
        run: npx tsx scripts/fix-recipes.ts

      - name: Commit changes
        run: |
          git config user.name "MamboRecetas Bot"
          git config user.email "bot@recetasmambo.com"
          git add data/recipes.json
          git diff --cached --quiet || git commit -m "chore: daily scrape — new recipes"

      - name: Push
        run: git push

      - name: Deploy to Vercel
        run: npx vercel --prod --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

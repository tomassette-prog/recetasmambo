name: Daily Recipe Pipeline

on:
  schedule:
    - cron: "0 3 * * *"  # Every day at 3:00 AM UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Scrape new recipes
        run: npx tsx scripts/scrape-bulk.ts --limit 10

      - name: Enrich images from source pages
        run: npx tsx scripts/enrich-images.ts --limit 10
        continue-on-error: true

      - name: Download recipe images locally
        run: npx tsx scripts/download-images.ts --limit 10
        continue-on-error: true

      - name: Fix categories, encoding, conversion rules
        run: npx tsx scripts/fix-recipes.ts

      - name: Generate social media posts
        run: npx tsx scripts/social-media.ts
        continue-on-error: true

      - name: Commit and push
        run: |
          git config user.name "MamboRecetas Bot"
          git config user.email "bot@recetasmambo.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: daily scrape — new recipes, images, social posts"
          git push

      - name: Deploy to Vercel
        run: npx vercel --prod --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
